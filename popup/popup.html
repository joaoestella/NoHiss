<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NoHiss</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="simple-view">
    <header>
      <img src="../icons/icon48.png" alt="" width="26" height="26" />
      <h1>NoHiss</h1>
      <div id="view" class="view-switch" role="radiogroup" data-i18n-aria-label="view.label">
        <button role="radio" data-view="simple" data-i18n="view.simple"></button>
        <button role="radio" data-view="pro" data-i18n="view.pro"></button>
      </div>
      <label class="lang" data-i18n-title="lang.label">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span id="langCode">EN</span>
        <!-- Native menu with the full language names, laid over the short code. -->
        <select id="lang" data-i18n-aria-label="lang.label"></select>
      </label>
    </header>

    <section id="hero" class="hero" data-state="off">
      <div class="hero-text">
        <h2 id="heroTitle"></h2>
        <p id="heroSub" class="hero-sub" aria-live="polite"></p>
      </div>
      <ul id="chips" class="chips">
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c1.5-3 3-3 4.5 0s3 3 4.5 0 3-3 4.5 0 3 3 4.5 0"/></svg><span data-i18n="chip.hiss"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-i18n="chip.hum"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg><span data-i18n="chip.noise"></span></li>
      </ul>
      <div class="power-wrap">
        <span class="pulse" aria-hidden="true"></span>
        <button id="toggle" class="power" aria-pressed="false">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle id="ringFill" class="fill-ring" cx="50" cy="50" r="47"/></svg>
          <svg class="power-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
          <span id="toggleWord" class="power-word"></span>
        </button>
      </div>
    </section>
    <p id="error" class="error" hidden></p>

    <!-- Simple: three strength presets. -->
    <section id="simple" class="simple" hidden>
      <p id="strengthLabel" class="caption" data-i18n="strength.label"></p>
      <div class="presets" role="radiogroup" aria-labelledby="strengthLabel">
        <button role="radio" data-amount="0.35" data-i18n="strength.light"></button>
        <button role="radio" data-amount="0.6" data-i18n="strength.medium"></button>
        <button role="radio" data-amount="0.85" data-i18n="strength.strong"></button>
      </div>
    </section>

    <!-- Pro: filters, learning, scan, exact strength and meter. -->
    <section id="controls" class="controls" aria-disabled="true" hidden>
      <div class="tabs" role="tablist">
        <button id="tabClean" role="tab" data-tab="clean" data-i18n="tab.clean"></button>
        <button id="tabScan" role="tab" data-tab="scan" data-i18n="tab.scan"></button>
      </div>

      <div id="panelClean" class="needs-on" role="tabpanel">
      <div class="segmented" role="radiogroup" data-i18n-aria-label="mode.label">
        <button id="modeSpectral" role="radio" data-mode="spectral" data-i18n="mode.spectral"></button>
        <button id="modeRnnoise" role="radio" data-mode="rnnoise" data-i18n="mode.rnnoise"></button>
      </div>
      <p id="modeHint" class="hint"></p>

      <div id="learnBox" class="learn">
        <div id="learnIdle">
          <button id="learnBtn" class="accent-outline" data-i18n="learn.button"></button>
          <p id="learnError" class="error" hidden></p>
          <p class="hint" data-i18n="learn.hint"></p>
        </div>
        <div id="learnRunning" hidden>
          <div class="row"><span data-i18n="learn.listening"></span><span id="learnTime">0 / 30 s</span></div>
          <div class="bar"><div id="learnBar" class="fill"></div></div>
          <button id="learnCancel" class="link" data-i18n="learn.cancel"></button>
        </div>
        <div id="learnDone" hidden>
          <div class="row"><span data-i18n="learn.fingerprint"></span><strong id="learnLevel"></strong></div>
          <canvas id="curve" width="560" height="120" data-i18n-aria-label="learn.curveLabel"></canvas>
          <div class="row actions">
            <button id="learnAgain" class="link" data-i18n="learn.again"></button>
            <button id="forget" class="link" data-i18n="learn.forget"></button>
          </div>
        </div>
      </div>
      </div>

      <div id="panelScan" role="tabpanel" hidden>
        <div id="scanIdle">
          <button id="scanBtn" class="accent-outline" data-i18n="scan.button"></button>
          <p class="hint" data-i18n="scan.hint"></p>
        </div>
        <div id="scanRunning" hidden>
          <div class="row"><span data-i18n="scan.listening"></span><span id="scanTime">0 / 30 s</span></div>
          <div class="bar"><div id="scanBar" class="fill"></div></div>
          <p class="hint" data-i18n="scan.runningHint"></p>
        </div>
        <div id="scanDone" hidden>
          <canvas id="scanChart" width="560" height="128" data-i18n-aria-label="scan.chart"></canvas>
          <p class="hint" data-i18n="scan.pick"></p>
          <ul id="scanList" class="scan-list"></ul>
          <p id="scanEmpty" class="hint" data-i18n="scan.empty" hidden></p>
          <div class="row actions">
            <button id="scanAgain" class="link" data-i18n="scan.again"></button>
          </div>
        </div>
        <p id="scanError" class="error" hidden></p>
      </div>

      <div class="shared needs-on">
      <label class="row" for="amount">
        <span data-i18n="amount.label"></span>
        <output id="amountValue">60%</output>
      </label>
      <input id="amount" type="range" min="0" max="100" step="1" value="60" />
      <p class="hint" data-i18n="amount.hint"></p>

      <div class="meter" aria-live="polite">
        <div class="row">
          <span id="meterLabel"></span>
          <strong id="reduction">— dB</strong>
        </div>
        <div class="bar"><div id="reductionBar" class="fill"></div></div>
        <div id="vadRow" class="row small" hidden>
          <span class="voice"><i id="voiceDot"></i> <span data-i18n="meter.voice"></span></span>
          <span id="vadValue">—</span>
        </div>
      </div>
      </div>
    </section>

    <button id="compare" class="hold" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg>
      <span id="compareText"></span>
    </button>

    <footer>
      <span class="local"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="footer"></span></span>
      <span class="links">
        <a class="privacy-link" href="../docs/index.html" target="_blank" rel="noopener noreferrer" data-i18n="privacy.link"></a> ·
        <a class="privacy-link" href="../docs/terms.html" target="_blank" rel="noopener noreferrer" data-i18n="terms.link"></a>
      </span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
